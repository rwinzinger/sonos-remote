# Verified against real hardware. Do not bump these "to latest" — see CLAUDE.md:
#   - core 2.0.17: Arduino_GFX 1.3.1 does NOT compile on core 3.x (IDF 5 renamed the
#     RGB-panel callback type and the IDF list macros; core 3.x also dropped
#     ledcSetup/ledcAttachPin).
#   - lvgl 8.3.6: what Elecrow's bundle actually ships, despite their readme saying 8.3.11.
#
# WARNING: `arduino-cli compile -m crowpanel` resolves libraries from the Arduino index,
# which may NOT be byte-identical to Elecrow's bundled copies in example/libraries/ (their
# lvgl ships with a tuned lv_conf.h). Until that is verified, prefer the explicit FQBN:
#
#   FQBN="esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app,CDCOnBoot=cdc"
#   arduino-cli compile --fqbn "$FQBN" --build-property upload.maximum_size=10485760 .
#
# A large LVGL sketch also needs a sketch-local partitions.csv (stock max app is 3 MB).

profiles:
  crowpanel:
    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (2.0.17)
    libraries:
      - lvgl (8.3.6)
      - GFX Library for Arduino (1.3.1)
